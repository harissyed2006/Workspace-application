<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace</title>
    <style>
      /* Global motion polish — keeps the app feeling fluid */
      html { scroll-behavior: smooth; }
      @keyframes app-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes app-pop-in {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes app-card-in {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      button {
        transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), filter 0.18s ease,
          opacity 0.18s ease, background-color 0.18s ease, color 0.18s ease,
          border-color 0.18s ease, box-shadow 0.18s ease;
      }
      button:hover:not(:disabled) { filter: brightness(0.95); }
      button:active:not(:disabled) { transform: scale(0.96); transition-duration: 0.06s; }
      input, textarea, select {
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #4C5FD5 !important;
        box-shadow: 0 0 0 3px rgba(76,95,213, 0.15);
      }
      .app-page { animation: app-fade-in 0.3s ease; }
      .app-overlay {
        animation: app-fade-in 0.2s ease;
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
      }
      .app-modal { animation: app-pop-in 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      .app-card {
        animation: app-card-in 0.2s ease;
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 0.18s ease, opacity 0.18s ease;
      }
      .app-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 14px rgba(30,34,48, 0.13) !important;
      }
      .app-card:active { cursor: grabbing; }
      /* Respect users who prefer less motion */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
